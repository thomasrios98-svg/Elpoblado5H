<script>
window.YAMAHA_GALLERY=[
'/img/yamaha-1.webp',
'/img/yamaha-2.webp',
'/img/yamaha-3.webp',
'/img/yamaha-4.webp'
];
window.showYamahaGallery=function(){
 let i=0;
 const bg=document.createElement('div');
 bg.style='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:flex;align-items:center;justify-content:center;';
 bg.innerHTML=`<button id="ygclose" style="position:absolute;top:20px;right:20px;font-size:32px;color:white;background:none;border:none;cursor:pointer;z-index:2">✕</button>
 <button id="ygprev" style="position:absolute;left:10px;font-size:40px;color:white;background:none;border:none;cursor:pointer;z-index:2">❮</button>
 <img id="ygimg" src="${window.YAMAHA_GALLERY[0]}" style="max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain">
 <div id="ygcounter" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:white;font-size:14px;font-family:sans-serif">1 / 4</div>
 <button id="ygnext" style="position:absolute;right:10px;font-size:40px;color:white;background:none;border:none;cursor:pointer;z-index:2">❯</button>`;
 document.body.appendChild(bg);
 const img=bg.querySelector('#ygimg');
 const counter=bg.querySelector('#ygcounter');
 function update(){img.src=window.YAMAHA_GALLERY[i];counter.textContent=(i+1)+' / '+window.YAMAHA_GALLERY.length;}
 bg.querySelector('#ygclose').onclick=()=>bg.remove();
 bg.querySelector('#ygprev').onclick=()=>{i=(i-1+window.YAMAHA_GALLERY.length)%window.YAMAHA_GALLERY.length;update();};
 bg.querySelector('#ygnext').onclick=()=>{i=(i+1)%window.YAMAHA_GALLERY.length;update();};
 bg.addEventListener('click',function(e){if(e.target===bg)bg.remove();});
}
</script>

 <img id="kgimg" src="${window.KICHI_GALLERY[0]}" style="max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain">
 <div id="kgcounter" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:white;font-size:14px;font-family:sans-serif">1 / 3</div>
 <button id="kgnext" style="position:absolute;right:10px;font-size:40px;color:white;background:none;border:none;cursor:pointer;z-index:2">❯</button>`;
 document.body.appendChild(bg);
 const img=bg.querySelector('#kgimg');
 const counter=bg.querySelector('#kgcounter');
 function update(){img.src=window.KICHI_GALLERY[i];counter.textContent=(i+1)+' / '+window.KICHI_GALLERY.length;}
 bg.querySelector('#kgclose').onclick=()=>bg.remove();
 bg.querySelector('#kgprev').onclick=()=>{i=(i-1+window.KICHI_GALLERY.length)%window.KICHI_GALLERY.length;update();};
 bg.querySelector('#kgnext').onclick=()=>{i=(i+1)%window.KICHI_GALLERY.length;update();};
 bg.addEventListener('click',function(e){if(e.target===bg)bg.remove();});
}
</script>
</body>
</html>
